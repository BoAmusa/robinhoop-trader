services:
  - name: robinhoop-trader
    type: worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: false
    disk:
      # Mounted at /data, which is also the app's working directory (see Dockerfile).
      # This is what makes the Robinhood session, daily-loss baseline, and signal
      # dedup tracker survive restarts/redeploys instead of resetting every time.
      name: robinhoop-trader-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # sync: false means these are NOT stored in this file or in git — you fill
      # them in through the Render dashboard when the Blueprint is created.
      - key: ROBINHOOD_USERNAME
        sync: false
      - key: ROBINHOOD_PASSWORD
        sync: false
      # Not stored here — fill in via the Render dashboard, same as the credentials above.
      - key: ROBINHOOD_ACCOUNT_NUMBER
        sync: false
      # Keep false until you've reviewed dry-run output during real market hours.
      - key: LIVE_TRADING_ENABLED
        value: "false"
      # auto is required here — Render gives you no interactive terminal to
      # answer a per-trade y/N prompt. Safety rests on the vars below instead.
      - key: TRADE_APPROVAL_MODE
        value: "auto"
      - key: MAX_POSITION_PCT
        value: "0.05"
      - key: MAX_DAILY_LOSS_PCT
        value: "0.02"
      - key: CHECK_INTERVAL_MINUTES
        value: "15"
      - key: HISTORY_DAYS
        value: "120"
